<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Access denied — Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700..900&family=Inter:wght@400..600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#F3EEE8;font-family:"Inter",system-ui,sans-serif;color:#101012;padding:24px}
  .card{background:#fff;border:1px solid rgba(16,16,18,.09);border-radius:18px;padding:40px 36px;max-width:420px;text-align:center;box-shadow:0 14px 34px rgba(120,60,20,.10)}
  .ico{font-size:38px;margin-bottom:14px}
  h1{font-family:"Archivo",sans-serif;font-size:20px;margin:0 0 10px}
  p{margin:0 0 22px;color:#6B7280;font-size:14.5px;line-height:1.6}
  a{display:inline-block;background:#F97316;color:#fff;font-weight:700;font-size:14px;padding:11px 22px;border-radius:999px;text-decoration:none}
  a:hover{background:#EA580C}
</style>
</head>
<body>
  <div class="card">
    <div class="ico">🔒</div>
    <h1>You don't have access to this section</h1>
    <p>Your admin account is restricted to specific sections of the panel. Ask a full admin to grant you access if you need this page.</p>
    <a href="/panel/">Back to Dashboard</a>
  </div>
</body>
</html>
